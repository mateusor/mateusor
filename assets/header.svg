<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Mateus Oliveira — Engenharia de Software">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0A0A"/>
      <stop offset="1" stop-color="#18181B"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#18181B" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#18181B" stop-opacity="0"/>
      <stop offset="1" stop-color="#18181B" stop-opacity="0.9"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <rect width="1200" height="300" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="14" fill="url(#grid)"/>
  <rect width="1200" height="300" rx="14" fill="url(#fade)"/>

  <!-- acento vermelho -->
  <rect x="72" y="78" width="6" height="144" rx="3" fill="#E5484D"/>

  <text x="104" y="104" class="mono" font-size="17" fill="#71717A" letter-spacing="1.5">~/mateusor</text>
  <text x="104" y="166" class="sans" font-size="58" font-weight="700" fill="#FAFAFA" letter-spacing="-1">Mateus Oliveira</text>
  <text x="106" y="208" class="mono" font-size="20" fill="#A1A1AA">Engenharia de Software<tspan fill="#E5484D"> · </tspan>Full Stack<tspan fill="#E5484D"> · </tspan>PUC-Campinas<tspan class="cursor" fill="#E5484D"> ▍</tspan></text>

  <!-- detalhe à direita -->
  <g class="mono" font-size="15" fill="#52525B" text-anchor="end">
    <text x="1128" y="112">flutter · firebase</text>
    <text x="1128" y="140">next.js · typescript</text>
    <text x="1128" y="168">java · mongodb</text>
  </g>
  <circle cx="1124" cy="206" r="5" fill="#E5484D"/>
  <circle cx="1106" cy="206" r="5" fill="#3F3F46"/>
  <circle cx="1088" cy="206" r="5" fill="#3F3F46"/>
</svg>
